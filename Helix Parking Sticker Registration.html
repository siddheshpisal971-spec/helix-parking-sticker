<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HELIX Parking Sticker Registration</title>

<style>
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f2f2f2;
}

.banner{
  width:100%;
  min-height:100vh;
  background:linear-gradient(90deg,#0b8acb 0%,#13b5a0 100%);
  display:flex;
  align-items:center;
  justify-content:flex-end;
  padding:50px;
  box-sizing:border-box;
}

.card{
  background:#ededed;
  width:380px;
  padding:40px 35px;
  box-sizing:border-box;
}

.card h2{
  margin:0;
  font-size:20px;
  color:#2f5f59;
  line-height:1.5;
  letter-spacing:.5px;
}

.card a{
  display:inline-block;
  margin-top:50px;
  background:#0a4a4a;
  color:white;
  padding:12px 25px;
  text-decoration:none;
  font-size:14px;
  border-radius:4px;
}

.card a:hover{
  background:#073838;
}

@media(max-width:600px){
  .banner{
    justify-content:center;
    padding:25px;
  }

  .card{
    width:100%;
    max-width:380px;
  }
}
</style>
</head>

<body>

<div class="banner">

  <div class="card">

    <h2>
      REGISTRATION FOR<br>
      HELIX PARKING STICKER
    </h2>

    <a href="register.html">START NOW</a>

  </div>

</div>

</body>
</html>
